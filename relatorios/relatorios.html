<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios Acadêmicos</title>
  <link rel="stylesheet" href="relatorios.css">
</head>
<body>

  <div class="main-wrapper">
      
    <header class="reports-header">
      <div class="header-top-icons">
        <a href="../index.html" class="icon-btn" aria-label="Voltar">
          <img src="../img/icon-back.png" alt="Voltar" class="header-icon-img">
        </a>
        <button type="button" class="icon-btn" aria-label="Configurações">
          <img src="../img/icon-settings.png" alt="Configurações" class="header-icon-img">
        </button>
      </div>
      <h1 class="header-title">Relatórios Acadêmicos</h1>
      <p class="header-subtitle">Realize o download de relatórios e documentos aqui:</p>
    </header>

    <main class="content-section">
      <h2 class="section-title">Documentos Disponíveis</h2>
      
      <div class="documents-list">
        
        <div class="doc-card">
          <div class="doc-info-block">
            <div class="doc-icon-wrapper">
              <img src="../img/pdf.png" alt="PDF" class="pdf-icon-img">
            </div>
            <div class="doc-text">
              <strong class="doc-name">Histórico escolar</strong>
              <span class="doc-date">Atualizado em 12/05/26</span>
            </div>
          </div>
          <button type="button" class="btn-download-inline">
            <img src="../img/downloads.png" alt="" class="download-icon-img">
            Baixar
          </button>
        </div>

        <div class="doc-card">
          <div class="doc-info-block">
            <div class="doc-icon-wrapper">
              <img src="../img/pdf.png" alt="PDF" class="pdf-icon-img">
            </div>
            <div class="doc-text">
              <strong class="doc-name">Boletim de Desempenho</strong>
              <span class="doc-date">Atualizado em 12/05/26</span>
            </div>
          </div>
          <button type="button" class="btn-download-inline">
            <img src="../img/downloads.png" alt="" class="download-icon-img">
            Baixar
          </button>
        </div>

        <div class="doc-card">
          <div class="doc-info-block">
            <div class="doc-icon-wrapper">
              <img src="../img/pdf.png" alt="PDF" class="pdf-icon-img">
            </div>
            <div class="doc-text">
              <strong class="doc-name">Coeficiente de Rendimento</strong>
              <span class="doc-date">Atualizado em 12/05/26</span>
            </div>
          </div>
          <button type="button" class="btn-download-inline">
            <img src="../img/downloads.png" alt="" class="download-icon-img">
            Baixar
          </button>
        </div>

        <div class="doc-card">
          <div class="doc-info-block">
            <div class="doc-icon-wrapper">
              <img src="../img/pdf.png" alt="PDF" class="pdf-icon-img">
            </div>
            <div class="doc-text">
              <strong class="doc-name">Plano de estudos</strong>
              <span class="doc-date">Atualizado em 12/05/26</span>
            </div>
          </div>
          <button type="button" class="btn-download-inline">
            <img src="../img/downloads.png" alt="" class="download-icon-img">
            Baixar
          </button>
        </div>

      </div>
    </main>

    <footer class="footer-controls">
      <button type="button" class="btn-add-more" aria-label="Adicionar documento">+</button>
      <div class="accessibility-wrapper">
        <button type="button" class="btn-accessibility" aria-label="Acessibilidade">
          <img src="../img/icon-accessibility.png" alt="Acessibilidade" class="accessibility-icon-img">
        </button>
      </div>
    </footer>

  </div>

</body>
</html>
